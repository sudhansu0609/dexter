version: '3.8'

# Dexter's private metasearch. Runs entirely on your machine; queries reach only
# your box, which proxies the public engines, so no provider ever learns who you
# are. Start with:  cd searxng && docker compose up -d   (verify http://localhost:8080)
#
# Port 8080 is deliberately the same as BuzzcafAI's SearXNG - if that one is
# already running, Dexter reuses it and you do not need this second container.
services:
  searxng:
    container_name: dexter_searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
